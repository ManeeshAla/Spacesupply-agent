# Optional: PostgreSQL instead of the default SQLite file.
#   docker compose up -d db
#   export DATABASE_URL=postgresql+psycopg2://space:space@localhost:5432/spacesupply   (pip install psycopg2-binary)
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: space, POSTGRES_PASSWORD: space, POSTGRES_DB: spacesupply }
    ports: ["5432:5432"]
